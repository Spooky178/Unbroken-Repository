<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="super-container">
        <div id="navbar">
        </div>
        <div id="body">

            <button id="add-book-btn" command="show-modal" commandfor="new-book-dialog">+</button>
            <dialog id="new-book-dialog">
                <form id="new-book-form" method="dialog">
                    <p>
                        <label for="title">Title</label>
                        <input name="title" id="title" />
                    </p>
                    <p>
                        <label for="author">Author</label>
                        <input name="author" id="author" />
                    </p>
                    <p>
                        <label for="page-count">How many pages</label>
                        <input name="page-count" id="page-count" />
                    </p>
                    <p>
                        <label for="isRead">Is it read yet</label>
                        <input type="checkbox" name="isRead" id="isRead" />
                    </p>

                    <button id='submit-btn'>Submit</button>
                </form>
                <button commandfor="new-book-dialog" command="close">Close</button>
            </dialog>

        </div>
    </div>

    <!-- Link to external JavaScript file placed before the closing body tag -->
    <script src="script.js"></script>
</body>
</html>
