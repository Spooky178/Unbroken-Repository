<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="super-container">
        <div id="navbar">
            <h1>Library</h1>
        </div>
        <div id="body">

            <button id="add-book-btn" command="show-modal" commandfor="new-book-dialog">+</button>
            <dialog id="new-book-dialog">
                <form id="new-book-form" method="dialog">
                    <p>
                        <label for="title">Title</label>
                        <input name="title" id="title" minlength="3" maxlength="32"/>
                    </p>
                        <span>Between 3 and 30 characters</span>
                    <p>
                        <label for="author">Author</label>
                        <input name="author" id="author" minlength="3" maxlength="20"/>
                    </p>
                        <span>Between 3 and 30 characters</span>
                    <p>
                        <label for="page-count">Total pages</label>
                        <input name="page-count" id="page-count" pattern="^[0-9]+$"/>                        
                    </p>
                        <span>Only numbers</span>
                    <p>
                        <label for="isRead">Is it read yet</label>
                        <input type="checkbox" name="isRead" id="isRead" />
                    </p>
                    <div class="form-button-bar">
                        <button id='submit-btn'>Submit</button>
                        <button id="close-btn" commandfor="new-book-dialog" command="close" type="button">Close</button>
                    </div>
                    </form>
            </dialog>

        </div>
    </div>

    <!-- Link to external JavaScript file placed before the closing body tag -->
    <script src="script.js"></script>
</body>
</html>
