<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="./Calculator_files/styles.css">
</head>
<body>
    <div class="calculator">
        <div class="display screen">
            <p class="display text">0</p>
        </div>
        <div class="input">
            <div id="digit" style="row-gap: 21.4px;">

            <button class="digit" id="9" style="height: 85.6px; width: 77.3333px;">9</button><button class="digit" id="8" style="height: 85.6px; width: 77.3333px;">8</button><button class="digit" id="7" style="height: 85.6px; width: 77.3333px;">7</button><button class="digit" id="6" style="height: 85.6px; width: 77.3333px;">6</button><button class="digit" id="5" style="height: 85.6px; width: 77.3333px;">5</button><button class="digit" id="4" style="height: 85.6px; width: 77.3333px;">4</button><button class="digit" id="3" style="height: 85.6px; width: 77.3333px;">3</button><button class="digit" id="2" style="height: 85.6px; width: 77.3333px;">2</button><button class="digit" id="1" style="height: 85.6px; width: 77.3333px;">1</button><button class="digit" id="0" style="height: 85.6px; width: 77.3333px;">0</button><button class="decimal" id="." style="height: 85.6px; width: 77.3333px;">.</button><button class="equate" id="=" style="height: 85.6px; width: 77.3333px;">=</button></div>
            <div id="operator" style="row-gap: 21.4px;">

            <button class="reset" id="AC" style="height: 85.6px; width: 77.3333px;">AC</button><button class="delete" id="Del" style="height: 85.6px; width: 77.3333px;">Del</button><button class="operator" id="/" style="height: 85.6px; width: 77.3333px;">/</button><button class="operator" id="-" style="height: 85.6px; width: 77.3333px;">-</button><button class="operator" id="+" style="height: 85.6px; width: 77.3333px;">+</button><button class="operator" id="*" style="height: 85.6px; width: 77.3333px;">*</button></div>

        </div>
    </div>

    <!-- Link to external JavaScript file -->
    <script src="./Calculator_files/script.js"></script>

</body></html>
